[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "contract-review-agent"
version = "1.0.0"
description = "An LLM agent that reads pricing contracts; deterministic code applies the rulebook and fills the review workbook."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["pypdf>=4.0", "openpyxl>=3.1", "PyYAML>=6.0"]

[project.optional-dependencies]
samples = ["reportlab>=4.0"]

[project.scripts]
contract-review = "contract_review.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
